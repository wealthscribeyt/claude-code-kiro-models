name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go mod tidy
        run: go mod tidy && git diff --exit-code
      - name: go fix
        run: go fix ./... && git diff --exit-code
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: Run tests
        run: go test -race ./...

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Ultimate-proxy fork: no homebrew-tap token step — the upstream
      # workflow published to d-kuro/homebrew-tap using secrets this fork
      # does not have; keep the release local to this repository.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
