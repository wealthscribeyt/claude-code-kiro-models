version: 2

builds:
  - id: kirocc
    main: ./cmd/kirocc
    binary: kirocc
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # Ultimate-proxy: Windows builds included (taken from kiro2cc's approach
    # of shipping first-class Windows exes). Windows/amd64 is the primary
    # local-bridge target.

archives:
  - id: kirocc
    ids:
      - kirocc
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# Ultimate-proxy fork: no homebrew_casks — the upstream config published to
# d-kuro/homebrew-tap, which this fork cannot (and should not) write to.

release:
  draft: false
  prerelease: auto
